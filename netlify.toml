[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# The service worker must never be served from HTTP cache, so updates arrive.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
